name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release job at a time per branch; a newer push cancels an older run that has not published yet.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # create/update GitHub Releases

env:
  BASE_VERSION: "1.0"   # MAJOR.MINOR; PATCH and versionCode come from the CI run number (never committed back)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.x
          channel: stable
          cache: true

      - name: Install modern glslc (Vulkan shader compiler)
        run: |
          # The NDK's bundled glslc is too old for the cooperative-matrix shaders in llama.cpp's Vulkan backend.
          mkdir -p "$RUNNER_TEMP/vksdk" && cd "$RUNNER_TEMP/vksdk"
          curl -fsSL --retry 3 https://sdk.lunarg.com/sdk/download/latest/linux/vulkan-sdk.tar.xz -o sdk.tar.xz
          tar -xf sdk.tar.xz
          GLSLC=$(find . -type f -name glslc -path '*x86_64/bin/*' | head -1)
          test -n "$GLSLC" || { echo "glslc not found in SDK"; ls; exit 1; }
          sudo ln -sf "$(realpath "$GLSLC")" /usr/local/bin/glslc
          echo "VULKAN_SDK=$(dirname "$(dirname "$(realpath "$GLSLC")")")" >> "$GITHUB_ENV"
          glslc --version

      - name: Compute version
        id: ver
        run: |
          echo "name=${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Prepare signing
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KS_B64" | base64 -d > android/release.jks
            {
              echo "storePassword=$KS_PASS"
              echo "keyPassword=$KEY_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=$GITHUB_WORKSPACE/android/release.jks"
            } > android/key.properties
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets: building DEVELOPMENT-signed artifacts (published as pre-release)."
          fi

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APKs
        env:
          NEUROMESH_ALLOW_DEBUG_RELEASE_SIGNING: ${{ steps.sign.outputs.production == 'true' && 'false' || 'true' }}
        run: |
          V='--build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }}'
          flutter build apk --release --target-platform android-arm64 --split-per-abi $V
          flutter build apk --release $V

      # Google Play build: no self-updater and none of the restricted permissions
      # (all-files access, install packages, battery-optimisation exemption).
      - name: Build Play AAB
        env:
          NEUROMESH_ALLOW_DEBUG_RELEASE_SIGNING: ${{ steps.sign.outputs.production == 'true' && 'false' || 'true' }}
        run: |
          V='--build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }}'
          M=android/app/src/main/AndroidManifest.xml
          sed -i -E '/MANAGE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES|REQUEST_IGNORE_BATTERY_OPTIMIZATIONS|WRITE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE/d' "$M"
          flutter build appbundle --release --dart-define=PLAY_BUILD=true $V

      - name: Play policy and size check
        run: |
          set -e
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          AAB=build/app/outputs/bundle/release/app-release.aab
          # 1) The merged manifest must not contain restricted permissions.
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" > "$RUNNER_TEMP/manifest.xml"
          if grep -E 'MANAGE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES|REQUEST_IGNORE_BATTERY_OPTIMIZATIONS|SYSTEM_ALERT_WINDOW|READ_SMS|READ_CALL_LOG|QUERY_ALL_PACKAGES|ACCESS_BACKGROUND_LOCATION' "$RUNNER_TEMP/manifest.xml"; then
            echo "::error::Play-restricted permission found in the AAB manifest"; exit 1
          fi
          echo "Permissions in the Play build:"; grep -o 'android.permission.[A-Z_]*' "$RUNNER_TEMP/manifest.xml" | sort -u
          # 2) Download size AFTER Play splits the bundle (arm64 phone, typical density).
          cat > "$RUNNER_TEMP/spec.json" <<'EOF2'
          {"supportedAbis":["arm64-v8a","armeabi-v7a"],"supportedLocales":["en","ar"],"screenDensity":480,"sdkVersion":34}
          EOF2
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$AAB" --output="$RUNNER_TEMP/out.apks" --device-spec="$RUNNER_TEMP/spec.json" --overwrite
          SIZE=$(java -jar "$RUNNER_TEMP/bundletool.jar" get-size total --apks="$RUNNER_TEMP/out.apks" --device-spec="$RUNNER_TEMP/spec.json" | tail -1 | awk -F, '{print $2}' | tr -dc 0-9)
          AABSZ=$(stat -c%s "$AAB")
          echo "AAB file: $((AABSZ/1048576)) MB"
          echo "Download size on an arm64 phone after Play splitting: $((SIZE/1048576)) MB (Play limit: 200 MB per module)"
          echo "SPLIT_MB=$((SIZE/1048576))" >> "$GITHUB_ENV"
          echo "AAB_MB=$((AABSZ/1048576))" >> "$GITHUB_ENV"
          if [ "$SIZE" -gt 198000000 ]; then
            echo "::error::Over the Play 200 MB limit"; exit 1
          fi
          if [ "$SIZE" -gt 170000000 ]; then echo "::warning::Download size is close to the Play limit"; fi

      - name: Collect and verify artifacts
        id: art
        run: |
          set -e
          V='${{ steps.ver.outputs.name }}'
          SUF=""; [ '${{ steps.sign.outputs.production }}' = 'true' ] || SUF="-dev"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/NeuroMesh-AI-v${V}-arm64${SUF}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/NeuroMesh-AI-v${V}-universal${SUF}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/NeuroMesh-AI-v${V}${SUF}.aab"
          for f in dist/*; do test -s "$f" || { echo "empty artifact $f"; exit 1; }; done
          for f in dist/*.apk; do unzip -tq "$f"; done
          unzip -tq dist/*.aab
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: neuromesh-ai-${{ steps.ver.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V='${{ steps.ver.outputs.name }}'
          PRE=""; [ '${{ steps.sign.outputs.production }}' = 'true' ] || PRE="--prerelease"
          KIND="production-signed"; [ -n "$PRE" ] && KIND="DEVELOPMENT-signed (not production-ready)"
          NOTES="NeuroMesh AI v${V}
          - Build date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Commit: ${GITHUB_SHA}
          - Signing: ${KIND}
          - Play AAB: ${AAB_MB} MB file, ${SPLIT_MB} MB download on an arm64 phone after Play splitting (limit 200 MB)
          - Checksums: SHA256SUMS.txt"
          # Immutable version tag: never overwritten.
          gh release create "v${V}" dist/* --target "${GITHUB_SHA}" --title "NeuroMesh AI v${V}" --notes "$NOTES" $PRE
          # Moving 'latest' channel (marked as GitHub's Latest release, even when dev-signed): replaced only after this build succeeded.
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest dist/* --target "${GITHUB_SHA}" --title "NeuroMesh AI latest (v${V})" --notes "$NOTES" --latest

  # Windows and Linux desktop builds. They bundle llama.cpp's llama-server (CPU)
  # next to the app; the AI's shell commands use the computer's own shell.
  desktop:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      BASE_VERSION: "1.0"
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.x
          channel: stable
          cache: true

      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libasound2-dev libsecret-1-dev liblzma-dev libayatana-appindicator3-dev libmpv-dev mpv libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          flutter config --enable-linux-desktop

      - name: Windows desktop
        if: runner.os == 'Windows'
        run: flutter config --enable-windows-desktop

      - name: Add desktop platform folders
        run: flutter create --platforms=windows,linux --project-name neuromesh_ai --org com.neuromesh .

      - run: flutter pub get

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: flutter build linux --release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Bundle llama-server and package (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          B=build/linux/x64/release/bundle
          mkdir -p "$B/llama" dl
          TAG=$(gh release list --repo ggml-org/llama.cpp --limit 20 --json tagName -q '.[].tagName' | grep -E '^b[0-9]+$' | head -1); echo "llama.cpp $TAG"
          gh release download "$TAG" --repo ggml-org/llama.cpp --pattern '*ubuntu*x64*' --pattern '*linux*x64*' --dir dl || true
          ls dl
          mkdir -p dl/x
          for f in dl/*; do case "$f" in *.zip) unzip -q -o "$f" -d dl/x;; *.tar.gz) tar -xzf "$f" -C dl/x;; esac; done
          test -n "$(find dl/x -name llama-server | head -1)" || { echo "llama-server not in archive"; find dl/x | head; exit 1; }
          cp -r $(dirname "$(find dl/x -name llama-server | head -1)")/* "$B/llama/"
          chmod +x "$B/llama/llama-server"
          ls "$B/llama" | head -20
          tar -C "$B" -czf "NeuroMesh-AI-v${V}-linux-x64.tar.gz" .
          gh release upload "v${V}" "NeuroMesh-AI-v${V}-linux-x64.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload latest "NeuroMesh-AI-v${V}-linux-x64.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Bundle llama-server and package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          B=build/windows/x64/runner/Release
          mkdir -p "$B/llama" dl
          TAG=$(gh release list --repo ggml-org/llama.cpp --limit 20 --json tagName -q '.[].tagName' | grep -E '^b[0-9]+$' | head -1); echo "llama.cpp $TAG"
          gh release download "$TAG" --repo ggml-org/llama.cpp --pattern '*win*cpu*x64*' --dir dl
          ls dl
          mkdir -p dl/x
          for f in dl/*.zip; do unzip -q -o "$f" -d dl/x; done
          cp -r $(dirname "$(find dl/x -name llama-server.exe | head -1)")/* "$B/llama/"
          ls "$B/llama" | head -20
          powershell -Command "Compress-Archive -Path '$B/*' -DestinationPath 'NeuroMesh-AI-v${V}-windows-x64-portable.zip'"
          # Real installer (Start-menu entry, uninstaller) built with Inno Setup.
          choco install innosetup -y --no-progress
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          "$ISCC" "/DAppVersion=${V}" "/DSourceDir=$(cygpath -w "$PWD/$B")" "/DOutDir=$(cygpath -w "$PWD")" installer/neuromesh.iss
          ls -la NeuroMesh-AI-Setup-*.exe
          for f in "NeuroMesh-AI-v${V}-windows-x64-portable.zip" "NeuroMesh-AI-Setup-v${V}-x64.exe"; do
            gh release upload "v${V}" "$f" --clobber --repo "$GITHUB_REPOSITORY"
            gh release upload latest "$f" --clobber --repo "$GITHUB_REPOSITORY"
          done

  # "Pro" APK: the normal app plus an Alpine Linux sandbox (proot) so the AI can
  # run real commands. Not for Google Play (it downloads and runs programs).
  pro:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_VERSION: "1.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.x
          channel: stable
          cache: true

      - name: Install modern glslc (Vulkan shader compiler)
        run: |
          mkdir -p "$RUNNER_TEMP/vksdk" && cd "$RUNNER_TEMP/vksdk"
          curl -fsSL --retry 3 https://sdk.lunarg.com/sdk/download/latest/linux/vulkan-sdk.tar.xz -o sdk.tar.xz
          tar -xf sdk.tar.xz
          GLSLC=$(find . -type f -name glslc -path '*x86_64/bin/*' | head -1)
          sudo ln -sf "$(realpath "$GLSLC")" /usr/local/bin/glslc
          echo "VULKAN_SDK=$(dirname "$(dirname "$(realpath "$GLSLC")")")" >> "$GITHUB_ENV"

      - name: Prepare signing
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KS_B64" | base64 -d > android/release.jks
            { echo "storePassword=$KS_PASS"; echo "keyPassword=$KEY_PASS"; echo "keyAlias=$KEY_ALIAS"; echo "storeFile=$GITHUB_WORKSPACE/android/release.jks"; } > android/key.properties
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "production=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch proot (Termux build for Android)
        run: |
          set -e
          BASE=https://packages.termux.dev/apt/termux-main
          mkdir -p proot_dl && cd proot_dl
          curl -fsSL --retry 3 "$BASE/dists/stable/main/binary-aarch64/Packages" -o Packages
          debfor() { awk -v p="$1" 'BEGIN{RS="";FS="\n"} $1=="Package: " p {for(i=1;i<=NF;i++) if($i ~ /^Filename: /){sub("Filename: ","",$i); print $i}}' Packages | head -1; }
          for pkg in proot libtalloc; do
            f=$(debfor $pkg); test -n "$f" || { echo "package $pkg not found"; exit 1; }
            curl -fsSL --retry 3 "$BASE/$f" -o $pkg.deb
            mkdir -p x_$pkg && (cd x_$pkg && ar x ../$pkg.deb && tar -xf data.tar.* )
          done
          J=../android/app/src/main/jniLibs/arm64-v8a
          mkdir -p $J
          cp "$(find x_proot -type f -name proot | head -1)" $J/libproot.so
          cp "$(find x_proot -type f -path '*libexec/proot/loader' | head -1)" $J/libproot_loader.so
          cp "$(find x_libtalloc -type f -name 'libtalloc.so*' | head -1)" $J/libtalloc.so
          ls -la $J

      - run: flutter pub get

      - name: Build Pro APK
        env:
          NEUROMESH_ALLOW_DEBUG_RELEASE_SIGNING: ${{ steps.sign.outputs.production == 'true' && 'false' || 'true' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          SUF=""; [ '${{ steps.sign.outputs.production }}' = 'true' ] || SUF="-dev"
          flutter build apk --release --target-platform android-arm64 --dart-define=PRO_BUILD=true --build-name=$V --build-number=${GITHUB_RUN_NUMBER}
          cp build/app/outputs/flutter-apk/app-release.apk "NeuroMesh-AI-Pro-v${V}-arm64${SUF}.apk"
          unzip -tq "NeuroMesh-AI-Pro-v${V}-arm64${SUF}.apk"
          unzip -l "NeuroMesh-AI-Pro-v${V}-arm64${SUF}.apk" | grep -E 'libproot|libtalloc'
          gh release upload "v${V}" "NeuroMesh-AI-Pro-v${V}-arm64${SUF}.apk" --clobber
          gh release upload latest "NeuroMesh-AI-Pro-v${V}-arm64${SUF}.apk" --clobber
