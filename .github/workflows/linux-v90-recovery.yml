name: Linux v1.0.90 release recovery
on:
  push:
    branches: [fix/linux-v90-recovery]
    paths: [.github/workflows/linux-v90-recovery.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: linux-v90-recovery
  cancel-in-progress: true
env:
  NEUROMESH_REPORT_ENDPOINT: ${{ vars.NEUROMESH_REPORT_ENDPOINT }}
  NEUROMESH_REPORT_BOT_TOKEN: ${{ secrets.NEUROMESH_REPORT_BOT_TOKEN }}
  NEUROMESH_REPORT_CHAT_ID: ${{ secrets.NEUROMESH_REPORT_CHAT_ID }}
  REQUIRE_DEVELOPER_REPORT_DELIVERY: "true"
jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    env:
      BASE_VERSION: "1.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.x
          channel: stable
          cache: true

      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo timeout --kill-after=30s 300s apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s 1200s apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libasound2-dev libsecret-1-dev liblzma-dev libayatana-appindicator3-dev libmpv-dev mpv libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          flutter config --enable-linux-desktop

      - name: Windows desktop
        if: runner.os == 'Windows'
        run: flutter config --enable-windows-desktop

      - name: Add desktop platform folders
        run: flutter create --platforms=windows,linux --project-name neuromesh_ai --org com.neuromesh .

      - run: flutter pub get

      - name: Private developer report configuration
        shell: bash
        run: python scripts/report_build_config.py "$RUNNER_TEMP/neuromesh-report-defines.json"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: flutter build linux --release "--dart-define-from-file=$RUNNER_TEMP/neuromesh-report-defines.json" --build-name=1.0.90 --build-number=90

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release "--dart-define-from-file=$env:RUNNER_TEMP/neuromesh-report-defines.json" --build-name=1.0.90 --build-number=90

      - name: Build and install the desktop image runtime
        shell: bash
        run: |
          set -e
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bundle="$PWD/build/windows/x64/runner/Release"
            library=neuromesh_sd.dll
          else
            bundle="$PWD/build/linux/x64/release/bundle"
            library=libneuromesh_sd.so
          fi
          cmake -S local_plugins/sd_flutter_android/desktop -B build/desktop-image -DCMAKE_BUILD_TYPE=Release
          cmake --build build/desktop-image --config Release --parallel 2
          ctest --test-dir build/desktop-image -C Release --output-on-failure
          cmake --install build/desktop-image --config Release --prefix "$bundle"
          test -s "$bundle/native/$library"

      - name: Bundle llama-server and package (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="1.0.90"
          B=build/linux/x64/release/bundle
          mkdir -p "$B/llama" dl
          TAG=$(gh release list --repo ggml-org/llama.cpp --limit 20 --json tagName -q '.[].tagName' | grep -E '^b[0-9]+$' | head -1); echo "llama.cpp $TAG"
          gh release download "$TAG" --repo ggml-org/llama.cpp --pattern '*ubuntu*x64*' --pattern '*linux*x64*' --dir dl || true
          ls dl
          mkdir -p dl/x
          for f in dl/*; do case "$f" in *.zip) unzip -q -o "$f" -d dl/x;; *.tar.gz) tar -xzf "$f" -C dl/x;; esac; done
          test -n "$(find dl/x -name llama-server | head -1)" || { echo "llama-server not in archive"; find dl/x | head; exit 1; }
          cp -r $(dirname "$(find dl/x -name llama-server | head -1)")/* "$B/llama/"
          chmod +x "$B/llama/llama-server"
          "$B/llama/llama-server" --version
          LD_LIBRARY_PATH="$B/lib:$B/native:${LD_LIBRARY_PATH:-}" ldd "$B/neuromesh_ai" > "$RUNNER_TEMP/linux-runtime-links.txt"
          cat "$RUNNER_TEMP/linux-runtime-links.txt"
          if grep -q "not found" "$RUNNER_TEMP/linux-runtime-links.txt"; then exit 1; fi
          ls "$B/llama" | head -20
          tar -C "$B" -czf "NeuroMesh-AI-v${V}-linux-x64.tar.gz" .
          bash scripts/package_linux.sh "$B" "$V" web/icons/Icon-512.png
          if [[ "$GITHUB_REF" == "refs/heads/fix/linux-v90-recovery" ]]; then
            for f in "NeuroMesh-AI-v${V}-linux-x64.deb" "NeuroMesh-AI-v${V}-linux-x64.AppImage"; do
              test -s "$f"
              gh release upload "v${V}" "$f" --clobber --repo "$GITHUB_REPOSITORY"
              gh release upload latest "$f" --clobber --repo "$GITHUB_REPOSITORY"
            done
          fi

      - name: Bundle llama-server and package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="1.0.90"
          B=build/windows/x64/runner/Release
          mkdir -p "$B/llama" dl
          TAG=$(gh release list --repo ggml-org/llama.cpp --limit 20 --json tagName -q '.[].tagName' | grep -E '^b[0-9]+$' | head -1); echo "llama.cpp $TAG"
          gh release download "$TAG" --repo ggml-org/llama.cpp --pattern '*win*cpu*x64*' --dir dl
          ls dl
          mkdir -p dl/x
          for f in dl/*.zip; do unzip -q -o "$f" -d dl/x; done
          cp -r $(dirname "$(find dl/x -name llama-server.exe | head -1)")/* "$B/llama/"
          ls "$B/llama" | head -20
          powershell -Command "Compress-Archive -Path '$B/*' -DestinationPath 'NeuroMesh-AI-v${V}-windows-x64-portable.zip'"
          # Real installer (Start-menu entry, uninstaller) built with Inno Setup.
          choco install innosetup -y --no-progress
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          export MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL="*"
          "$ISCC" "/DAppVersion=${V}" "/DSourceDir=$(cygpath -w "$PWD/$B")" "/DOutDir=$(cygpath -w "$PWD")" installer/neuromesh.iss
          ls -la NeuroMesh-AI-Setup-*.exe
          if [[ "$GITHUB_REF" == "refs/heads/fix/linux-v90-recovery" ]]; then
            installer="NeuroMesh-AI-Setup-v${V}-x64.exe"
            gh release upload "v${V}" "$installer" --clobber --repo "$GITHUB_REPOSITORY"
            gh release upload latest "$installer" --clobber --repo "$GITHUB_REPOSITORY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: neuromesh-ai-${{ runner.os }}-x64
          path: NeuroMesh-AI-*x64*
          if-no-files-found: error
